[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentx"
version = "0.79.9"
description = "agentX is a framework for building and deploying AI agents that can perform a wide range of tasks, from simple automation to complex problem-solving. It provides a flexible and extensible architecture that allows developers to create custom agents tailored to their specific needs."
readme = "README.md"
requires-python = ">=3.12"
#    "smolagents[litellm]>=1.24.0",
dependencies = [
    "asyncio>=4.0.0",
    "black>=26.1.0",
    "emoji>=2.15.0",
    "fastapi>=0.128.2",
    "flake8>=7.3.0",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "isort>=7.0.0",
    "libcst>=1.8.6",
    "matplotlib>=3.10.8",
    "mypy>=1.19.1",
    "numpy>=1.26.4",
    "ollama>=0.6.1",
    "pillow>=12.1.0",
    "pytest>=9.0.2",
    "pytoml>=0.1.21",
    "requests>=2.32.5",
    "setfit>=1.1.0",
    "toml>=0.10.2",
    "transformers>=4.41.0,<5.3",
    "uvicorn>=0.40.0",
    "tkinterweb>=3.24",
    "Markdown>=3.7",
]


[tool.setuptools]
packages = ["agentx", "agentix", "shared"]
include-package-data = true

[tool.setuptools.package-dir]
agentx = "src/agentx"
agentix = "src/agentix"
shared = "src/shared"

[tool.setuptools.package-data]
agentx = [
    "fonts/*.ttf",
    "assets/icons/opemmoji-svg-color/*.svg"
]

[tool.pytest.ini_options]
markers = [
    "live: live integration tests that require external services",
    "unit: hermetic unit tests with no external dependencies",
    "functional: functional tests exercising internal+external units",
    "integration: integration tests verifying interaction between two or more project units"
]
pythonpath = ["src"]
addopts = "--cov=src --cov-report=term-missing"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
