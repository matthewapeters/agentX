[agentx]
ollama_host = "localhost:11434"
ollama_model = "gpt-oss"
ollama_initial_load_timeout_seconds = 120
screen_side = "left"

[agentix]
# Agentix integration for code analysis and advanced tools  
# Requires: libcst package installed
agentix_bench_classification_model = "phi4-mini:3.8b"  # Override model used for classification
available_tools = ["cst", "ast"]
classification_backend = "ollama"
classification_torch_device = -1  # CPU; use 0 for first GPU
classification_torch_model = "typeform/distilbert-base-uncased-mnli"
classify_prompts = true   # Enable to analyze intent and route workflows
debug = false  # Enable for verbose classification logging to stderr
default_system_prompts = ["tool_use"]  # System prompts injected into every LLM tool-call request
host = "localhost:8000"

[agentix.classification_display]
enabled = true         # Master switch — show classification block in output panel
show_intent = true     # 🤔 intent: <value>
show_reasoning = true  # 🤔    reasoning: <text>
show_clarification = true  # 🤔    clarification needed / missing fields (suppressed when falsy)
show_next_step = true  # 💡 path: <next_step>

[agentx.working_memory]
enabled = true              # Master switch — enable 🏛️ Working Memory feature
inject_into_context = true  # Prepend enabled facts to LLM system context on each prompt
max_facts = 50              # Safety cap on total stored facts (0 = unlimited)
