[agentx]
chat_bridge_response_timeout_seconds = 120
submit_execution_timeout_seconds = 120
submit_timeout_seconds = 120
chat_backend = "ollama"
theme_mode = "Dark Mode"
context_history_session_sort = "Ascending"
show_log_locations_on_startup = true
applet_api_port_range_start = 19100   # First port in the range assigned to applet render APIs
applet_api_port_range_end   = 19199   # Last port (inclusive); must be >= start + number of applets

[agentx.ollama]
host = "localhost:11434"
model = "ornith:35b"
ollama_initial_load_timeout_seconds = 120

