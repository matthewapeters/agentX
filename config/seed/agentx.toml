# AgentX deployment configuration — baseline seed.
#
# These values mirror the built-in defaults (internal/config.Default()). They are
# the 1:1 baseline from which to tune; unknown keys are ignored by the decoder and
# absent keys fall back to these same defaults.

[agentx]
# provider selects the LLM backend. Valid values: "ollama" (default), "llamacpp".
# When unset, defaults to "ollama".
provider = "llamacpp"

[agentx.ollama]
host  = "localhost:11434"   # Ollama API host:port
model = "ornith:latest"    # must match an installed Ollama model

[agentx.llamacpp]
# Host and model for the llama.cpp HTTP server (llama-server).
# Only used when provider = "llamacpp". Host is host:port (default 8080).
# model must match a loaded model in the llama.cpp server instance.
host  = "localhost:8888"
model = "ornith-1.0-35b-Q4_K_M"

[agentx.classification]
retries               = 2   # re-attempts when a classification verdict won't parse
clarification_options = 3   # Stage-2: candidate interpretations offered on ambiguity

[agentx.output]
max_widget_lines = 20       # max body rows before an output widget scrolls in place

[agentx.thinking]
enabled             = true  # master switch for reasoning during respond (💭 widget)
time_budget_seconds = 180   # wall-clock cap on thinking; on expiry, answer directly

[agentx.thinking.routes]    # route-aware depth: which classification routes reason
respond_directly = false    # plain conversation answers without thinking
single_tool      = true
invoke_planner   = true

[agentx.theme]
active_border_color   = "cyan"        # focused panel + selected widget (bold)
inactive_border_color = "dark gray"   # unfocused panel + other widgets

[agentx.tools]
enabled          = true     # master switch for the single_tool execution cycle
timeout_seconds  = 30       # per-command execution timeout
output_max_bytes = 65536    # output cap before truncation (full output → artifact)
absolute_max_bytes = 2097152  # hard ceiling on the oversized-output recovery gate's "capture more"

[agentx.wavefront]
# ADR 0012: a second, experimental decomposition engine for invoke_planner plans —
# round-free, grounds every tool-call argument in already-verified facts before
# proposing it (closes a hallucination gap the original engine doesn't guard
# against). Off by default: the original engine (ADR 0008) keeps running
# invoke_planner plans until you opt in here.
enabled = true
